name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App — typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cornell-degree-planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cornell-degree-planner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  data-pipeline:
    name: Data pipeline — parser & validator corpora
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - name: Run every *.corpus.ts suite
        run: |
          for corpus in *.corpus.ts; do
            echo "::group::$corpus"
            npx tsx "$corpus"
            echo "::endgroup::"
          done

  security-rules:
    name: Firestore security rules — emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - run: npm ci
      - run: npm run test:rules
