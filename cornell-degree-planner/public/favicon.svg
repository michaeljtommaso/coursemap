<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Coursemap favicon (claude-design-2026-07-11, logo option 4 mini-mark):
       dark rounded tile, two curved tracks, two light course blocks converging
       into the emerald "next course" block. Hardcoded hex is intentional here —
       favicons cannot read CSS tokens (#0f172a = ink, #34d399 = complete). -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <g transform="translate(6 12)">
    <path d="M8 8.5 C24 8.5 28 18 40 19.5" stroke="#64748b" stroke-width="4" fill="none"/>
    <path d="M8 31.5 C24 31.5 28 22 40 20.5" stroke="#64748b" stroke-width="4" fill="none"/>
    <rect x="0" y="2" width="13" height="13" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="25" width="13" height="13" rx="4" fill="#f1f5f9"/>
    <rect x="38" y="13" width="14" height="14" rx="4" fill="#34d399"/>
  </g>
</svg>
